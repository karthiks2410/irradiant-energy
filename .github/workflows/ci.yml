name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Route types (LayoutProps, PageProps) are generated, not committed; tsc needs them first.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run test --if-present

      # Lists every engine constant the owner has not signed off (architecture.md §5.4).
      # Informational here; `npm run check:content -- --launch` is the cutover gate and fails
      # while a constant behind a rendered money figure is still "to-confirm" (OD-10).
      - run: npm run check:content

      - run: npm run build
